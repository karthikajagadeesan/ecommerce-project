<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S22 eCommerce Widget - External Site Demo</title>
    <!-- 
        THIS FILE IS AN EXAMPLE OF HOW TO EMBED THE ECOMMERCE WIDGET 
        INTO ANOTHER WEBSITE (e.g. Wordpress, Wix, Static HTML).
    -->
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #fafafa; padding: 40px; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 600px; margin: auto; }
        h1 { font-size: 24px; color: #111; margin-bottom: 20px; }
        p { color: #666; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>External Website Demo</h1>
        <p>This is a third-party website that is embedding the eCommerce widget via a simple script tag. The widget will automatically initialize and take over the screen as specified.</p>
        
        <!-- Placeholder content for the host site -->
        <p>Other site content follows here...</p>
    </div>

    <!-- 1. Configuration Script -->
    <script>
      window.S22EcommerceConfig = {
        projectId: "S22-PROJ-874281",
        token: "auth-tok-48787cf6-fdec",
        domain: window.location.origin // CHANGE THIS to your actual deployed domain (e.g. https://your-ecommerce-nextjs.vercel.app)
      };
    </script>

    <!-- 2. The Widget Loader Script -->
    <!-- In real scenario, src="https://your-domain.com/widget.js" -->
    <script src="/widget.js" defer></script>

</body>
</html>
